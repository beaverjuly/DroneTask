<!DOCTYPE html>
<html>
<head>
  <title>Drone Game</title>

  <!-- Load libraries -->
  <script src="static/lib/jquery-3.7.1/jquery-3.7.1.min.js"></script>
  <script src="static/lib/jspsych-6.3.1/jspsych.js"></script>
  <script src="static/lib/jspsych-6.3.1/plugins/jspsych-instructions.js" type="text/javascript"></script>
  <script src="static/lib/jspsych-6.3.1/plugins/jspsych-html-keyboard-response.js" type="text/javascript"></script>

  <script src="static/lib/jspsych-6.3.1/plugins/jspsych-call-function.js" type="text/javascript"></script>

  <meta charset="UTF-8">
  <style>
    body { margin: 50px; }
    .jspsych-display-element { transition: opacity 0.12s ease-in-out; }
    .jspsych-display-element.transitioning { opacity: 0; }
    
    /* Default jsPsych nav buttons: subtle, for instruction Prev/Next */
    .jspsych-btn {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 13px;
      border-radius: 9px;
      border: 1px solid rgba(148, 163, 184, 0.55);
      background: rgba(255, 255, 255, 0.55);
      color: rgba(51, 65, 85, 0.72);
      cursor: pointer;
      box-shadow: none;
      opacity: 0.72;
    }

    .jspsych-btn:hover {
      background: rgba(255, 255, 255, 0.85);
      color: rgba(30, 41, 59, 0.95);
      opacity: 1;
    }

    /* Fullscreen button only: prominent */
    .fullscreen-card .jspsych-btn,
    #jspsych-fullscreen-btn {
      font-size: 17px;
      font-weight: 800;
      padding: 12px 24px;
      border-radius: 13px;
      border: 1px solid #94a3b8;
      background: #1e40af;
      color: white;
      opacity: 1;
      box-shadow: 0 6px 18px rgba(30, 64, 175, .22);
    }

    .fullscreen-card .jspsych-btn:hover,
    #jspsych-fullscreen-btn:hover {
      background: #1d4ed8;
    }

    /* Persistent fullscreen reminder — small corner badge, non-intrusive */
    #fs-remind {
      position: fixed;
      top: 8px;
      right: 8px;
      z-index: 99999;
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(30,30,30,.88);
      color: #e2e8f0;
      font: 700 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
      user-select: none;
      display: none;
      box-shadow: 0 4px 14px rgba(0,0,0,.28);
    }
    #fs-remind:hover {
      background: rgba(30,30,30,.98);
    }
  </style>

<body>
<div id="fs-remind" onclick="document.documentElement.requestFullscreen().catch(function(){})">⛶ Return to full screen</div>
</body>
<script>
  // ──────────────────────────────────────────────────────────────
  // URL parameters (parsed early so mobile / dev checks can use them)
  // Prolific: ?PROLIFIC_PID=...&STUDY_ID=...&SESSION_ID=...
  // Debug fallbacks: workerId / subId
  // ──────────────────────────────────────────────────────────────
  var _urlParams = new URLSearchParams(window.location.search);

  function _getParam(name, fallback) {
    var v = _urlParams.get(name);
    return (v !== null && v !== '') ? v : fallback;
  }

  var DEV_MODE    = _urlParams.get('dev') === '1';
  var DEV_STAGE   = _urlParams.get('stage') || 'full';
  var DEV_NTRIALS = parseInt(_urlParams.get('ntrials'), 10) || 0;

  // DEV_BLOCK accepts either an integer ('1'–'4') or a named condition
  // string ('noBoundary', 'boundary'). Keep it as a string so named
  // variants aren't silently coerced to 1 by parseInt.
  var DEV_BLOCK   = _urlParams.get('block') || '1';
  // Numeric alias for code that needs an integer block index.
  var _blockAliases = { 'noBoundary': 1, 'boundary': 2 };
  var DEV_BLOCK_NUM = _blockAliases[DEV_BLOCK] || (parseInt(DEV_BLOCK, 10) || 1);

  // ?version=simple | version=rich — task variant switch.
  var DEV_VERSION = _urlParams.get('version') || 'full';

  // ──────────────────────────────────────────────────────────────
  // Pilot mode flag.
  //   pilot=1  (or missing)  → pilot/testing mode: save data, show
  //                            a thank-you screen, NO Prolific redirect.
  //   pilot=0                → production mode:    save data, then
  //                            redirect to Prolific via the existing
  //                            success / reject logic.
  // Default is pilot mode (opt-in to production) for safety.
  // ──────────────────────────────────────────────────────────────
  var PILOT_MODE = _urlParams.get('pilot') !== '0';
  console.log('[MODE] PILOT_MODE = ' + PILOT_MODE +
              '  (set ?pilot=0 in the URL for production / Prolific redirects)');

  // ──────────────────────────────────────────────────────────────
  // Consent toggle.
  //   consent=1 (or missing) → show the consent screen (default).
  //   consent=0              → skip the consent screen (dev/testing
  //                            ONLY; do not use in production).
  // ──────────────────────────────────────────────────────────────
  var SHOW_CONSENT = _urlParams.get('consent') !== '0';
  console.log('[MODE] SHOW_CONSENT = ' + SHOW_CONSENT +
              '  (set ?consent=0 to skip the consent screen during testing)');

  // ──────────────────────────────────────────────────────────────
  // Mobile rejection — mirrors Flask __init__.py error 1001.
  // Original blocked: android, iphone, ipad, wii. We add a few more
  // obvious mobile tokens. Skipped in DEV_MODE so you can still test.
  // ──────────────────────────────────────────────────────────────
  (function _mobileCheck() {
    if (DEV_MODE) return;
    var ua = (navigator.userAgent || '').toLowerCase();
    var MOBILE_TOKENS = [
      'android', 'iphone', 'ipad', 'ipod', 'blackberry',
      'windows phone', 'iemobile', 'opera mini', 'wii', 'mobile'
    ];
    var isMobile = MOBILE_TOKENS.some(function (t) { return ua.indexOf(t) !== -1; });
    if (isMobile) {
      document.body.innerHTML =
        '<div style="max-width:640px;margin:10vh auto;font-family:sans-serif;' +
        'text-align:center;padding:24px;border:1px solid #ddd;border-radius:8px;' +
        'background:#fff;">' +
        '<h2 style="color:#b00020;">Desktop browser required</h2>' +
        '<p style="font-size:16px;">This study can only be completed on a ' +
        'desktop or laptop computer with a physical keyboard.</p>' +
        '<p style="font-size:14px;color:#555;">Please return the study on ' +
        'Prolific, or reopen the link on a larger device.</p>' +
        '</div>';
      // Prevent further script execution in this block.
      throw new Error('Mobile device rejected (original Flask error 1001).');
    }
  })();

  // ──────────────────────────────────────────────────────────────
  // Participant identifiers
  // ──────────────────────────────────────────────────────────────
  var PROLIFIC_PID = _getParam('PROLIFIC_PID', null);
  var STUDY_ID     = _getParam('STUDY_ID',     null);
  var SESSION_ID   = _getParam('SESSION_ID',   null);

  // Debug fallbacks
  var workerId     = _getParam('workerId',     PROLIFIC_PID || _getParam('subId', 'debug_' + Date.now()));
  var assignmentId = _getParam('assignmentId', SESSION_ID   || 'debug_assignment');
  var hitId        = _getParam('hitId',        STUDY_ID     || 'debug_hit');

  // subId: random 24-char code, mirrors utils.gen_code(24) from the Flask app.
  // Pavlovia filenames are handled by Pavlovia, but keeping this column
  // preserves compatibility with any downstream scripts that read subId.
  function _genCode(N) {
    var chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    var out = '';
    for (var i = 0; i < N; i++) {
      out += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return out;
  }
  var subId = _getParam('subId', _genCode(24));

  // ──────────────────────────────────────────────────────────────
  // Prolific completion codes — REPLACE THESE before deployment.
  // Only used when PILOT_MODE is false.
  // ──────────────────────────────────────────────────────────────
  var CODE_SUCCESS = 'REPLACE_WITH_PROLIFIC_SUCCESS_CODE';
  var CODE_REJECT  = 'REPLACE_WITH_PROLIFIC_REJECT_CODE';

  // Expose identifiers for nivturk-plugins.js and for the data record.
  window.PARTICIPANT_INFO = {
    PROLIFIC_PID: PROLIFIC_PID,
    STUDY_ID:     STUDY_ID,
    SESSION_ID:   SESSION_ID,
    workerId:     workerId,
    assignmentId: assignmentId,
    hitId:        hitId,
    subId:        subId
  };

  if (DEV_MODE) {
    console.log('[DEV] Developer mode ENABLED');
    console.log('[DEV] stage=' + DEV_STAGE + ', block=' + DEV_BLOCK +
                ' (num=' + DEV_BLOCK_NUM + '), ntrials=' + DEV_NTRIALS +
                ', version=' + DEV_VERSION);
    console.log('[DEV] participant info:', window.PARTICIPANT_INFO);
  }

  function verify_unload(e) {
    e.preventDefault();
    (e || window.event).returnValue = null;
    return null;
  }

  window.addEventListener("beforeunload", verify_unload);

  // ──────────────────────────────────────────────────────────────
  // Consent state (replaces Flask /consent route).
  // consent_declined = true  → participant actively declined.
  // _bot_detected    = true  → honeypot triggered (ported from
  //                            consent.py "future_contact" bot check).
  // low_quality      = true  → any other early-end reason.
  // ──────────────────────────────────────────────────────────────
  var consent_declined = false;
  window._bot_detected = false;

  initLatinSquare();

  // Consent: auto-detected from consent.js (buildConsentTrial function).
  // If consent.js is missing or ?consent=0, consent is skipped.
  var consent_trial = [];
  if (typeof buildConsentTrial === 'function' && SHOW_CONSENT) {
    consent_trial = [buildConsentTrial({
      onDecline: function() { consent_declined = true; jsPsych.endExperiment(); },
      onBot:     function() { low_quality = true; jsPsych.endExperiment(); }
    })];
  } else if (!SHOW_CONSENT) {
    console.log('[CONSENT] consent=0 \u2014 consent screen SKIPPED.');
  } else {
    console.log('[CONSENT] consent.js not loaded \u2014 consent screen SKIPPED.');
  }

  // Fullscreen entry trial (after consent, before welcome).
  var enter_fullscreen = {
    type: 'fullscreen',
    fullscreen_mode: true,
    message:
    '<div style="' +

      'max-width:720px;margin:8vh auto;padding:34px 42px;border-radius:22px;' +

      'background:#f8fafc;border:2px solid #cbd5e1;' +

      'box-shadow:0 14px 42px rgba(15,23,42,.14);' +

      'font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;' +

      'text-align:center;line-height:1.6;color:#1f2937;">' +

      '<div style="font-size:44px;margin-bottom:10px;">🖥️</div>' +

      '<div style="font-size:30px;font-weight:850;margin-bottom:14px;">Full-screen mode</div>' +

      '<p style="font-size:20px;margin:0 0 14px 0;">' +

        'This study runs best in full screen.' +

      '</p>' +

      '<p style="font-size:16px;color:#64748b;margin:0;">' +

        'You can press <strong>Esc</strong> to exit. A small reminder will appear until you return.' +

      '</p>' +

    '</div>',
    button_label: 'Enter full screen and continue',
    delay_after: 200,
    on_finish: function() {
      window._hasEnteredFullscreen = true;
    }
  };

  // Persistent fullscreen monitor shows/hides the corner badge.
  (function initFullscreenMonitor() {
    window._hasEnteredFullscreen = window._hasEnteredFullscreen || false;

    function ensureBadge() {
      var badge = document.getElementById('fs-remind');

      if (!badge) {
        badge = document.createElement('div');
        badge.id = 'fs-remind';
        badge.innerHTML = '⛶ Return to full screen';
        badge.onclick = function() {
          var target = document.documentElement;
          var req =
            target.requestFullscreen ||
            target.webkitRequestFullscreen ||
            target.mozRequestFullScreen ||
            target.msRequestFullscreen;

          if (req) {
            req.call(target);
            window._hasEnteredFullscreen = true;
            setTimeout(checkFullscreenState, 250);
          }
        };

        document.documentElement.appendChild(badge);
      }

      return badge;
    }

    function isDomFullscreen() {
      return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
      );
    }

    function looksLikeFullscreenViewport() {
      // Fallback only. Browser-window fullscreen is not standardized.
      var heightGap = Math.abs(window.innerHeight - screen.height);
      var widthGap = Math.abs(window.innerWidth - screen.width);

      return heightGap < 80 && widthGap < 80;
    }

    function shouldShowBadge() {
      if (!window._hasEnteredFullscreen) return false;

      // If DOM fullscreen is active, hide badge.
      if (isDomFullscreen()) return false;

      // If browser still appears visually fullscreen, hide badge.
      // This avoids showing the badge when the user is in browser fullscreen
      // but not DOM fullscreen.
      if (looksLikeFullscreenViewport()) return false;

      return true;
    }

    function checkFullscreenState() {
      var badge = ensureBadge();

      if (isDomFullscreen()) {
        window._hasEnteredFullscreen = true;
        badge.style.display = 'none';
        return;
      }

      badge.style.display = shouldShowBadge() ? 'block' : 'none';
    }

    [
      'fullscreenchange',
      'webkitfullscreenchange',
      'mozfullscreenchange',
      'MSFullscreenChange',
      'resize',
      'focus',
      'blur',
      'visibilitychange',
      'mousemove',
      'keydown'
    ].forEach(function(evt) {
      document.addEventListener(evt, checkFullscreenState, true);
      window.addEventListener(evt, checkFullscreenState, true);
    });

    setInterval(checkFullscreenState, 500);
    checkFullscreenState();
  })();

  // ──────────────────────────────────────────────────────────────
  // Shared "glow + pop + drifting ▪️" transition-screen animation.
  // Used by: welcome, feedback0, feedback1, finish, and the
  // planet-transition ("New planet mission") screens — one visual
  // language reused everywhere instead of five bespoke style blocks.
  //
  // jsPsych replaces display_element's entire innerHTML per trial,
  // so only one of these is ever in the DOM at a time — fixed
  // class/keyframe names are safe to reuse across every call site.
  //
  // Usage: glowSquaresScreen(innerHtml, opts)
  //   opts.minHeight  — CSS height for the centered wrap (default 38vh)
  //   opts.glowColor  — 'r,g,b' triplet for the title's pulsing glow
  //   opts.density    — number of drifting ▪️ particles (default 7)
  // Tag any element you want to pulse-glow with class="glow-title".
  // ──────────────────────────────────────────────────────────────
  function glowSquaresScreen(innerHTML, opts) {
    opts = opts || {};
    var minHeight = opts.minHeight || '38vh';
    var glowColor = opts.glowColor || '30,64,175'; // indigo default
    var density   = opts.density   || 7;

    var lefts  = [8, 20, 34, 48, 62, 76, 90, 16, 56, 84];
    var sizes  = [10, 14, 8, 12, 10, 7, 11, 9, 13, 6];
    var durs   = [3.4, 2.8, 3.6, 2.5, 3.1, 3.3, 2.7, 3.0, 2.9, 3.5];
    var delays = [0, .5, 1.2, .3, .9, 1.6, .7, 1.1, .2, 1.4];

    var particles = '';
    for (var p = 0; p < density; p++) {
      particles +=
        '<div class="glow-particle" style="left:' + lefts[p % lefts.length] + '%;' +
        'animation-duration:' + durs[p % durs.length] + 's;' +
        'animation-delay:' + delays[p % delays.length] + 's;' +
        'font-size:' + sizes[p % sizes.length] + 'px;">▪️</div>';
    }

    return (
      '<style>' +
        '@keyframes glow-drift{' +
          '0%{transform:translateY(0) scale(1);opacity:0}' +
          '10%{opacity:.55}90%{opacity:.55}' +
          '100%{transform:translateY(-50vh) scale(0.2);opacity:0}' +
        '}' +
        '@keyframes glow-pop{' +
          '0%{transform:scale(0.86);opacity:0}' +
          '65%{transform:scale(1.035);opacity:1}' +
          '100%{transform:scale(1);opacity:1}' +
        '}' +
        '@keyframes glow-pulse{' +
          '0%,100%{text-shadow:0 0 6px rgba(' + glowColor + ',.25)}' +
          '50%{text-shadow:0 0 20px rgba(' + glowColor + ',.55)}' +
        '}' +
        '.glow-wrap{position:relative;overflow:hidden;min-height:' + minHeight + ';' +
          'display:flex;flex-direction:column;align-items:center;justify-content:center;' +
          'animation:glow-pop .5s cubic-bezier(.2,.8,.3,1.1) both;}' +
        '.glow-particle{position:absolute;bottom:-10px;pointer-events:none;' +
          'animation:glow-drift linear infinite;}' +
        '.glow-title{animation:glow-pulse 2.2s ease-in-out infinite;}' +
      '</style>' +
      '<div class="glow-wrap">' +
        particles +
        '<div style="position:relative;z-index:1;width:100%;">' + innerHTML + '</div>' +
      '</div>'
    );
  }

  var welcome = {
    type: 'instructions',
    pages: [
      glowSquaresScreen(
        '<div style="max-width:760px;margin:0 auto;text-align:center;font-size:20px;line-height:1.65;color:#1f2937;">' +
          '<div class="glow-title" style="font-size:32px;font-weight:800;margin-bottom:18px;">🌠 Welcome to the drone game! 🌌</div>' +
          '<p>You will complete a game, memory tests, and a questionnaire.</p>' +
          '<p>The study takes about <strong>50 minutes</strong>.</p>' +
          '<p>Your bonus payment depends on game performance, so please stay attentive and try your best.</p>' +
        '</div>',
        { minHeight: '40vh', glowColor: '30,64,175', density: 7 }
      )
    ],
    show_clickable_nav: true,
    button_label_previous: "Prev",
    button_label_next: "Next",
    data: {
      task_version: 'v3.1-png-main-practice-emoji-latin-square-block-order',
      stimuli_version: stimuli_version,

      true_vol: factors_vol,
      true_stc: factors_stc,
      true_valence: factors_valence,

      latin_square_group: latin_square_group,
      latin_square_order: block_order.join(','),
      latin_square_order_labels: block_order_labels.join('|'),

      randomized: randomized,

      PROLIFIC_PID: PROLIFIC_PID,
      STUDY_ID: STUDY_ID,
      SESSION_ID: SESSION_ID,
      subId: subId,
      pilot_mode: PILOT_MODE,
      consent_shown: SHOW_CONSENT
    }
  };

  // ── Stimulus sets: per-block randomization ──
  // Step 1: shuffle full pool once (participant-specific object order)
  var _shuffledPool = jsPsych.randomization.shuffle(STIMULUS_IMAGE_POOL.slice());

  // Step 2: slice into four 50-object chunks (unique objects per block)
  // Step 3: shuffle each chunk (decouple object identity from trial position)
  var stimulus_block_images = [];
  for (var _b = 0; _b < 4; _b++) {
    var chunk = _shuffledPool.slice(_b * 50, (_b + 1) * 50);
    stimulus_block_images.push(jsPsych.randomization.shuffle(chunk));
  }

  // Flat list for preloading and backward compat
  var stimulus_set_images = [].concat(
    stimulus_block_images[0], stimulus_block_images[1],
    stimulus_block_images[2], stimulus_block_images[3]
  );
  var practice_stimulus_images = PRACTICE_EMOJI.slice();

  // Save block stimulus orders as metadata (reconstructs exact object-trial mapping)
  window._stimulus_block_orders = stimulus_block_images.map(function(arr) {
    return arr.join('|');
  });

  if (DEV_MODE && DEV_NTRIALS > 0) {
    // Take the first DEV_NTRIALS images from EACH block so every block's
    // trials have their stimuli preloaded. The old slice(0, N) took only
    // from block 0, leaving blocks 1-3 un-cached during gameplay.
    var _devSubset = [];
    for (var _db = 0; _db < stimulus_block_images.length; _db++) {
      _devSubset = _devSubset.concat(
        stimulus_block_images[_db].slice(0, DEV_NTRIALS)
      );
    }
    stimulus_set_images = _devSubset;
    console.log('[DEV] Preload subset: ' + DEV_NTRIALS + ' imgs × ' +
                stimulus_block_images.length + ' blocks = ' +
                _devSubset.length + ' stimuli');
  }

  // ──────────────────────────────────────────────────────────────
  // Randomized practice-position helpers
  // Used only for practice blocks 1–5.
  // Main-task latent trajectories remain unchanged.
  // ──────────────────────────────────────────────────────────────
  function clampPracticeX(x) {
    return Math.max(12, Math.min(88, x));
  }

  function randBetween(min, max) {
    return min + Math.random() * (max - min);
  }

  function randSign() {
    return Math.random() < 0.5 ? -1 : 1;
  }

  function makePracticeDronePath(numTrials) {
    var path = [];
    var anchor1 = randBetween(32, 68);

    path.push(anchor1);

    if (numTrials >= 2) {
      path.push(clampPracticeX(anchor1 + randBetween(-4, 4)));
    }

    var anchor2 = null;
    if (numTrials >= 3) {
      var move = randSign() * randBetween(10, 16);
      anchor2 = clampPracticeX(anchor1 + move);

      if (Math.abs(anchor2 - anchor1) < 9) {
        anchor2 = clampPracticeX(anchor1 - move);
      }

      path.push(anchor2);
    }

    for (var i = 3; i < numTrials; i++) {
      path.push(clampPracticeX(anchor2 + randBetween(-4, 4)));
    }

    return path;
  }

  function makeRandomPracticeBag(droneX) {
    var wind = randBetween(-6, 6);
    return clampPracticeX(droneX + wind);
  }

  var make_trials = function(practice_no, block_order) {
    var num_trials = 10;
    var is_moving_practice = false;

  function getLastTrialOfType(trialType) {

  // Each comprehension plugin (comprehension1 / comprehension2) returns:
  //   done: true   → all answers correct, exit the loop
  //   done: false  → review_topic is set when the participant clicks

      ],
      loop_function: function() {

        return !passedComprehension(trialType);
      }
    };

          '<div class="glow-title" style="font-size:27px;font-weight:800;margin-bottom:14px;">🛰️ Pre-flight briefing</div>' +
          '<p>Next: the mission instructions, then a short understanding check.</p>' +
          '<p>Every answer must be correct before liftoff — read closely!</p>' +
        '</div>',
        { minHeight: '32vh', glowColor: '30,64,175', density: 5 }
      )
    ],
    show_clickable_nav: true,
    button_label_previous: "Prev",
    button_label_next: "Next"
  };

  var feedback1 = {
    type: 'instructions',
    pages: [
      glowSquaresScreen(
        '<div style="max-width:680px;margin:0 auto;text-align:center;font-size:20px;line-height:1.7;color:#1f2937;">' +
          '<div class="glow-title" style="font-size:27px;font-weight:800;margin-bottom:14px;">🌟 Mission complete</div>' +
          '<p>You’ve finished the drone mission and questionnaire — thank you!</p>' +
          '<p>One last screen will save everything and wrap up.</p>' +
        '</div>',
        { minHeight: '32vh', glowColor: '180,140,20', density: 5 }
      )
    ],
    show_clickable_nav: true,
    button_label_previous: "Prev",
    button_label_next: "Next"
  };

  var finish = {
    type: 'instructions',
    pages: [
      glowSquaresScreen(
        '<div style="max-width:680px;margin:0 auto;text-align:center;font-size:20px;line-height:1.7;color:#1f2937;">' +
          '<div class="glow-title" style="font-size:28px;font-weight:800;margin-bottom:16px;">Thank you for participating!</div>' +
          (PILOT_MODE
            ? '<p>Please click <strong>Finish</strong> to save your data.</p>' +
              '<p>After the confirmation message appears, you may close this tab.</p>'
            : '<p>Please click <strong>Finish</strong> to save your data and return to Prolific.</p>' +
              '<p style="font-size:16px;color:#555;">Do not close this tab until you are redirected.</p>'
          ) +
        '</div>',
        { minHeight: '32vh', glowColor: '30,64,175', density: 5 }
      )
    ],
    show_clickable_nav: true,
    allow_backward: false,
    button_label_next: "Finish"
  };

  // Preload image list (built by static/task/preload.js)
  var preload_images = buildPreloadImageList(stimulus_set_images, practice_stimulus_images);

  (async function() {
    var survey_demographics = {
      type: 'survey-demo',
      button_label: 'Continue'
    };

    function buildBlockMemoryTrials() {
      var num_blocks = block_order.length;
      if (num_blocks === 0) return trials;

      var block_length = Math.floor(trials.length / num_blocks);
      var new_trials = [];

      for (var b = 0; b < num_blocks; b++) {
        var start_idx = b * block_length;
        var end_idx = start_idx + block_length;
        new_trials = new_trials.concat(trials.slice(start_idx, end_idx));
        new_trials = new_trials.concat(create_memory_timeline(b + 1));
      }

      return new_trials;
    }

    var timeline = [];

    // ── Stage normalisation and dev-route aliases ──
    //
    // 'gate' → 'instructions': the compatibility gate was removed from
    // runtime, so old ?stage=gate links now land on the instructions
    // route instead of a removed-feature placeholder. If a compatibility
    // gate is reintroduced in the future, delete this one alias entry —
    // dev_routes.js still has a literal stage==='gate' branch ready to
    // receive it (see the comment there).
    //
    // 'encoding-test' is the canonical name for the combined
    // encoding+memory-test route (previously called "Full block";
    // internal stage value is still 'block', unchanged, so old
    // ?stage=block / ?stage=block1 / ?stage=block2 links keep working).
    // Several alternate spellings are mapped too because a literal '+'
    // typed directly in a URL query string is decoded to a SPACE by
    // URLSearchParams (form-encoding rules) — it does NOT survive as
    // a '+' character — so '?stage=encoding+test' actually arrives
    // here as the string "encoding test". Use 'encoding-test' (hyphen)
    // when sharing links; it round-trips through any URL bar untouched.
    var _stageMap = {
      'bird': 'encoding', 'memory': 'test',
      'block1': 'block',  'block2': 'block',
      'encoding-test':  'block',   // ← canonical, recommended
      'encoding_test':  'block',
      'encoding test':  'block',   // unencoded '+' decodes to this
      'encoding+test':  'block',   // properly percent-encoded (%2B) decodes to this
      'gate': 'instructions'
    };
    var _stage = _stageMap[DEV_STAGE] || DEV_STAGE;

    if (DEV_STAGE === 'block1') { DEV_BLOCK_NUM = 1; }
    if (DEV_STAGE === 'block2') { DEV_BLOCK_NUM = 2; }

    // ── Build task timeline ──
    var _skipPreload = false;

    if (DEV_MODE && _stage !== 'full') {
      // Dev route: delegate to dev_routes.js
      var _devResult = buildDevTimeline({
        stage:                  _stage,
        devBlockNum:            DEV_BLOCK_NUM,
        devBlock:               DEV_BLOCK,
        devNtrials:             DEV_NTRIALS,
        devVersion:             DEV_VERSION,
        trials:                 trials,
        create_memory_timeline: create_memory_timeline,
        welcome:                welcome,
        feedback0:              feedback0,
        instructions_loop:      instructions_loop,
        comprehensionTimeline:  comprehensionOnlyTimeline,
        consent_trial:          consent_trial,
        enter_fullscreen:       enter_fullscreen,
        buildBlockMemoryTrials:  buildBlockMemoryTrials,
        survey_demographics:    survey_demographics,
        feedback1:              feedback1,
        finish:                 finish,
        SHOW_CONSENT:           SHOW_CONSENT
      });
      timeline = _devResult.timeline;
      _skipPreload = _devResult.skipPreload;
    } else {
      // Full experiment (production or dev ?stage=full)
      if (DEV_MODE) {
        console.log('[DEV] stage: full experiment' +
                    (DEV_NTRIALS > 0 ? ' (ntrials=' + DEV_NTRIALS + ')' : '') +
                    ', version=' + DEV_VERSION);
      }
      var combinedTrials = buildBlockMemoryTrials();

      timeline = timeline.concat(
        consent_trial,
        enter_fullscreen,
        welcome,
        feedback0,
        instructions_loop,
        combinedTrials,
        survey_demographics,
        feedback1,
        finish,
        { type: 'fullscreen', fullscreen_mode: false }
      );
    }

    // ── Environment detection and data-saving setup ──
    // (logic in static/task/data_saving.js)
    var _env = initEnvironment(_urlParams, DEV_MODE, PILOT_MODE);

    // ── Prefix trials: Pavlovia-init → metadata stamp → preload ──
    var _prefixTrials = [];

    if (_env.USE_PAVLOVIA) {
      _prefixTrials.push({ type: 'pavlovia', command: 'init' });
    }

    _prefixTrials.push(buildMetadataStampTrial(_env,
      { PROLIFIC_PID: PROLIFIC_PID, STUDY_ID: STUDY_ID,
        SESSION_ID: SESSION_ID, workerId: workerId, subId: subId },
      { pilotMode: PILOT_MODE, devMode: DEV_MODE, showConsent: SHOW_CONSENT,
        latinSquareGroup: latin_square_group,
        blockOrder: block_order, blockOrderLabels: block_order_labels }
    ));

    // Performance benchmark — measures timer resolution and DOM speed.
    // Flags machines where timing precision may compromise data quality.
    _prefixTrials.push({
      type: 'call-function',
      func: function() {
        var N = 200;
        var t0 = performance.now();
        for (var i = 0; i < N; i++) { performance.now(); }
        var timerMs = (performance.now() - t0) / N;

        var d0 = performance.now();
        for (var j = 0; j < 50; j++) {
          var el = document.createElement('div');
          document.body.appendChild(el);
          document.body.removeChild(el);
        }
        var domMs = (performance.now() - d0) / 50;

        var slow = (timerMs > 0.5 || domMs > 2.0);
        jsPsych.data.addProperties({
          perf_timer_ms_per_call: Math.round(timerMs * 1000) / 1000,
          perf_dom_ms_per_op: Math.round(domMs * 1000) / 1000,
          perf_slow_flag: slow,
          stimulus_block_orders: window._stimulus_block_orders
            ? window._stimulus_block_orders.join('|||') : null
        });
        if (slow) console.warn('[PERF] Slow machine detected: timer=' + timerMs.toFixed(3) + 'ms, dom=' + domMs.toFixed(3) + 'ms');
      }
    });

    var _preloadTrial = buildPreloadTrial(_skipPreload, preload_images);
    if (_preloadTrial) _prefixTrials.push(_preloadTrial);

    timeline = _prefixTrials.concat(timeline);

    // Record total supply_caught (for bonus calculation) as final metadata.
    timeline.push({
      type: 'call-function',
      func: function() {
        var mainTrials = jsPsych.data.get().filter({ trial_type: 'trial' }).values();
        var totalCaught = 0;
        var totalScore = 0;
        var mainCount = 0;
        for (var t = 0; t < mainTrials.length; t++) {
          if (mainTrials[t].practice_no && mainTrials[t].practice_no !== 0) continue;
          if (typeof mainTrials[t].supply_caught === 'number') {
            totalCaught += mainTrials[t].supply_caught;
            totalScore += (mainTrials[t].score || 0);
            mainCount++;
          }
        }
        jsPsych.data.addProperties({
          total_supply_caught: totalCaught,
          total_score: totalScore,
          total_scored_trials: mainCount
        });
        console.log('[DATA] Total supply caught: ' + totalCaught + '/' + (mainCount * 10) +
                    ', total score: ' + totalScore);
      }
    });

    // ── Suffix: Pavlovia finish (must be last) ──
    if (_env.USE_PAVLOVIA) {
      timeline.push({
        type: 'pavlovia',
        command: 'finish',
        participantId: PROLIFIC_PID || workerId
      });
    }

    // ── Launch ──
    jsPsych.init({
      timeline: timeline,
      show_progress_bar: true,
      on_finish: buildOnFinishCallback(_env, {
        PROLIFIC_PID:      PROLIFIC_PID,
        workerId:          workerId,
        assignmentId:      assignmentId,
        hitId:             hitId,
        PILOT_MODE:        PILOT_MODE,
        DEV_MODE:          DEV_MODE,
        CODE_SUCCESS:      CODE_SUCCESS,
        CODE_REJECT:       CODE_REJECT,
        getConsentDeclined: function() { return consent_declined; },
        getLowQuality:      function() { return low_quality; },
        verifyUnload:       verify_unload
      })
    });
  })();
</script>
</html>
