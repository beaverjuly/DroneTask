<body></body>
<script>
  // ──────────────────────────────────────────────────────────────
  // URL parameters (parsed early so mobile / dev checks can use them)
  // Prolific: ?PROLIFIC_PID=...&STUDY_ID=...&SESSION_ID=...
  // Debug fallbacks: workerId / subId
  // ──────────────────────────────────────────────────────────────
  var _urlParams = new URLSearchParams(window.location.search);

  function _getParam(name, fallback) {
    var v = _urlParams.get(name);
    return (v !== null && v !== '') ? v : fallback;
  }

  var DEV_MODE    = _urlParams.get('dev') === '1';
  var DEV_STAGE   = _urlParams.get('stage') || 'full';
  var DEV_NTRIALS = parseInt(_urlParams.get('ntrials'), 10) || 0;

  // DEV_BLOCK accepts either an integer ('1'–'4') or a named condition
  // string ('noBoundary', 'boundary'). Keep it as a string so named
  // variants aren't silently coerced to 1 by parseInt.
  var DEV_BLOCK   = _urlParams.get('block') || '1';
  // Numeric alias for code that needs an integer block index.
  var _blockAliases = { 'noBoundary': 1, 'boundary': 2 };
  var DEV_BLOCK_NUM = _blockAliases[DEV_BLOCK] || (parseInt(DEV_BLOCK, 10) || 1);

  // ?version=simple | version=rich — task variant switch.
  var DEV_VERSION = _urlParams.get('version') || 'full';
  // Set ?gate=0 to skip the compatibility gate during local debugging.
  // By default, the gate is shown even in dev links.
  var SHOW_COMPAT_GATE = false;

  // ──────────────────────────────────────────────────────────────
  // Pilot mode flag.
  //   pilot=1  (or missing)  → pilot/testing mode: save data, show
  //                            a thank-you screen, NO Prolific redirect.
  //   pilot=0                → production mode:    save data, then
  //                            redirect to Prolific via the existing
  //                            success / reject logic.
  // Default is pilot mode (opt-in to production) for safety.
  // ──────────────────────────────────────────────────────────────
  var PILOT_MODE = _urlParams.get('pilot') !== '0';
  console.log('[MODE] PILOT_MODE = ' + PILOT_MODE +
              '  (set ?pilot=0 in the URL for production / Prolific redirects)');

  // ──────────────────────────────────────────────────────────────
  // Consent toggle.
  //   consent=1 (or missing) → show the consent screen (default).
  //   consent=0              → skip the consent screen (dev/testing
  //                            ONLY; do not use in production).
  // ──────────────────────────────────────────────────────────────
  var SHOW_CONSENT = _urlParams.get('consent') !== '0';
  console.log('[MODE] SHOW_CONSENT = ' + SHOW_CONSENT +
              '  (set ?consent=0 to skip the consent screen during testing)');

  // ──────────────────────────────────────────────────────────────
  // Mobile rejection — mirrors Flask __init__.py error 1001.
  // Original blocked: android, iphone, ipad, wii. We add a few more
  // obvious mobile tokens. Skipped in DEV_MODE so you can still test.
  // ──────────────────────────────────────────────────────────────
  (function _mobileCheck() {
    if (DEV_MODE) return;
    var ua = (navigator.userAgent || '').toLowerCase();
    var MOBILE_TOKENS = [
      'android', 'iphone', 'ipad', 'ipod', 'blackberry',
      'windows phone', 'iemobile', 'opera mini', 'wii', 'mobile'
    ];
    var isMobile = MOBILE_TOKENS.some(function (t) { return ua.indexOf(t) !== -1; });
    if (isMobile) {
      document.body.innerHTML =
        '<div style="max-width:640px;margin:10vh auto;font-family:sans-serif;' +
        'text-align:center;padding:24px;border:1px solid #ddd;border-radius:8px;' +
        'background:#fff;">' +
        '<h2 style="color:#b00020;">Desktop browser required</h2>' +
        '<p style="font-size:16px;">This study can only be completed on a ' +
        'desktop or laptop computer with a physical keyboard.</p>' +
        '<p style="font-size:14px;color:#555;">Please return the study on ' +
        'Prolific, or reopen the link on a larger device.</p>' +
        '</div>';
      // Prevent further script execution in this block.
      throw new Error('Mobile device rejected (original Flask error 1001).');
    }
  })();

  // ──────────────────────────────────────────────────────────────
  // Participant identifiers
  // ──────────────────────────────────────────────────────────────
  var PROLIFIC_PID = _getParam('PROLIFIC_PID', null);
  var STUDY_ID     = _getParam('STUDY_ID',     null);
  var SESSION_ID   = _getParam('SESSION_ID',   null);

  // Debug fallbacks
  var workerId     = _getParam('workerId',     PROLIFIC_PID || _getParam('subId', 'debug_' + Date.now()));
  var assignmentId = _getParam('assignmentId', SESSION_ID   || 'debug_assignment');
  var hitId        = _getParam('hitId',        STUDY_ID     || 'debug_hit');

  // subId: random 24-char code, mirrors utils.gen_code(24) from the Flask app.
  // Pavlovia filenames are handled by Pavlovia, but keeping this column
  // preserves compatibility with any downstream scripts that read subId.
  function _genCode(N) {
    var chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    var out = '';
    for (var i = 0; i < N; i++) {
      out += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return out;
  }
  var subId = _getParam('subId', _genCode(24));

  // ──────────────────────────────────────────────────────────────
  // Prolific completion codes — REPLACE THESE before deployment.
  // Only used when PILOT_MODE is false.
  // ──────────────────────────────────────────────────────────────
  var CODE_SUCCESS = 'REPLACE_WITH_PROLIFIC_SUCCESS_CODE';
  var CODE_REJECT  = 'REPLACE_WITH_PROLIFIC_REJECT_CODE';

  // Expose identifiers for nivturk-plugins.js and for the data record.
  window.PARTICIPANT_INFO = {
    PROLIFIC_PID: PROLIFIC_PID,
    STUDY_ID:     STUDY_ID,
    SESSION_ID:   SESSION_ID,
    workerId:     workerId,
    assignmentId: assignmentId,
    hitId:        hitId,
    subId:        subId
  };

  if (DEV_MODE) {
    console.log('[DEV] Developer mode ENABLED');
    console.log('[DEV] stage=' + DEV_STAGE + ', block=' + DEV_BLOCK +
                ' (num=' + DEV_BLOCK_NUM + '), ntrials=' + DEV_NTRIALS +
                ', version=' + DEV_VERSION);
    console.log('[DEV] participant info:', window.PARTICIPANT_INFO);
  }

  function verify_unload(e) {
    e.preventDefault();
    (e || window.event).returnValue = null;
    return null;
  }

  window.addEventListener("beforeunload", verify_unload);

  // ──────────────────────────────────────────────────────────────
  // Consent state (replaces Flask /consent route).
  // consent_declined = true  → participant actively declined.
  // _bot_detected    = true  → honeypot triggered (ported from
  //                            consent.py "future_contact" bot check).
  // low_quality      = true  → any other early-end reason.
  // ──────────────────────────────────────────────────────────────
  var consent_declined = false;
  window._bot_detected = false;

  // ──────────────────────────────────────────────────────────────
  // Latin-square block-order counterbalancing
  //
  // Canonical design indices:
  //   0 = reward, high volatility / low stochasticity
  //   1 = reward, low  volatility / high stochasticity
  //   2 = loss,   high volatility / low stochasticity
  //   3 = loss,   low  volatility / high stochasticity
  //
  // The latent position sequences remain attached to their canonical
  // design index. The Latin Square only changes the order in which
  // participants encounter the four canonical conditions.
  // ──────────────────────────────────────────────────────────────

  var CANONICAL_CONDITION_LABELS = [
    'A_reward_highVol_lowStc',
    'B_reward_lowVol_highStc',
    'C_loss_highVol_lowStc',
    'D_loss_lowVol_highStc'
  ];

  var LATIN_SQUARE_4 = [
    [0, 1, 3, 2],
    [1, 2, 0, 3],
    [2, 3, 1, 0],
    [3, 0, 2, 1]
  ];

  function hashStringToInt(s) {
    var h = 0;
    s = String(s || '');

    for (var i = 0; i < s.length; i++) {
      h = ((h << 5) - h) + s.charCodeAt(i);
      h |= 0; // force 32-bit integer
    }

    return Math.abs(h);
  }

  function isPermutationOf0123(arr) {
    if (!Array.isArray(arr) || arr.length !== 4) return false;

    var seen = {};
    for (var i = 0; i < arr.length; i++) {
      if (arr[i] < 0 || arr[i] > 3) return false;
      if (seen[arr[i]]) return false;
      seen[arr[i]] = true;
    }

    return true;
  }

  function getCanonicalConditionId(designIdx) {
    return CANONICAL_CONDITION_LABELS[designIdx] || ('condition_' + designIdx);
  }

  function getLatinSquareGroup() {
    // Optional dev override:
    //   ?latin_group=0
    //   ?latin_group=1
    //   ?latin_group=2
    //   ?latin_group=3
    var forced = _urlParams.get('latin_group');

    if (forced !== null && forced !== '') {
      var forcedInt = parseInt(forced, 10);
      if (!isNaN(forcedInt) && forcedInt >= 0 && forcedInt < LATIN_SQUARE_4.length) {
        console.log('[LATIN] Using forced latin_group=' + forcedInt);
        return forcedInt;
      }

      console.warn('[LATIN] Ignoring invalid latin_group=' + forced);
    }

    // Prefer stable external participant IDs when available.
    // In local/debug mode, workerId may include Date.now(), so group can vary across reloads.
    var idForCounterbalance =
      PROLIFIC_PID ||
      workerId ||
      subId ||
      SESSION_ID ||
      ('debug_' + Date.now());

    return hashStringToInt(idForCounterbalance) % LATIN_SQUARE_4.length;
  }

  var latin_square_group = getLatinSquareGroup();
  var block_order = LATIN_SQUARE_4[latin_square_group].slice();

  if (!isPermutationOf0123(block_order)) {
    throw new Error('[LATIN] Invalid block_order: ' + JSON.stringify(block_order));
  }

  // Backward-compatible alias.
  // Existing downstream code still uses the variable name `randomized`.
  // Under the revised design, this is no longer a free random shuffle;
  // it is the participant's Latin-square block order.
  var randomized = block_order.slice();

  var block_order_labels = block_order.map(function(idx) {
    return getCanonicalConditionId(idx);
  });
  
  if (DEV_MODE) {
    console.log('[DEV] Latin-square group:', latin_square_group);
    console.log('[DEV] Block order:', block_order);
    console.log('[DEV] Block order labels:', block_order_labels);
  }

  console.log('[LATIN] latin_square_group =', latin_square_group);
  console.log('[LATIN] block_order =', block_order);
  console.log('[LATIN] block_order_labels =', block_order_labels);

  // ──────────────────────────────────────────────────────────────
  // Consent form — REPLACE THE PLACEHOLDER TEXT BELOW with your
  // IRB-approved consent language before deploying to Pavlovia.
  // This screen preserves the original Flask consent flow:
  //   - renders consent text
  //   - offers "I agree" / "I do not agree" buttons
  //   - includes an invisible honeypot checkbox (future_contact)
  //     that bots sometimes auto-fill. If checked, we flag the
  //     participant as low quality and route to Prolific reject.
  // Whether this screen is shown is controlled by SHOW_CONSENT.
  // ──────────────────────────────────────────────────────────────
  var consent_trial = {
    type: 'html-button-response',
    stimulus:
      '<div style="max-width:820px; margin:auto; text-align:left; font-size:16px; line-height:1.45em;">' +
        '<h2 style="text-align:center;">Consent to participate</h2>' +
        '<p><strong>Study Title:</strong> Drone Tracking and Memory Study</p>' +
        '<p><strong>Purpose of the study:</strong> The purpose of this study is to understand how people learn from changing environments and remember items that appear during a computer-based task.</p>' +
        '<p><strong>What you will do:</strong> You will complete a drone-tracking game, short memory tests, and demographic questions. The study takes approximately 50 minutes.</p>' +
        '<p><strong>Risks:</strong> The risks are minimal and are similar to those of everyday computer use. You may experience mild fatigue or boredom.</p>' +
        '<p><strong>Benefits:</strong> You may not receive direct personal benefits. Your participation may help researchers better understand learning, decision-making, and memory.</p>' +
        '<p><strong>Voluntary participation:</strong> Your participation is voluntary. You may stop at any time by closing the browser window.</p>' +
        '<p><strong>Compensation:</strong> You will receive the base payment described on Prolific. You may also receive a bonus based on task performance and data quality checks, as described in the study listing.</p>' +
        '<p><strong>Confidentiality:</strong> Your responses will be stored for research purposes. Your Prolific ID and session information may be recorded to match study completion and payment, but the data will be analyzed without directly identifying you.</p>' +
        '<p><strong>Contact:</strong> If you have questions about the study, please contact [NAME] at [EMAIL]. If you have questions about your rights as a participant, please contact [IRB CONTACT].</p>' +
        '<p style="margin-top:1.5em;"><strong>By clicking "I agree" below, you ' +
        'confirm that you have read the above and agree to participate.</strong></p>' +
        '<div style="position:absolute; left:-9999px; top:-9999px; ' +
        'height:0; width:0; overflow:hidden;" aria-hidden="true">' +
          '<label>' +
            'If you would like to be contacted for future studies, check this box: ' +
            '<input type="checkbox" id="future_contact" name="future_contact" tabindex="-1" autocomplete="off">' +
          '</label>' +
        '</div>' +
      '</div>',
    choices: ['I agree and wish to participate', 'I do not agree'],
    on_load: function () {
      var hp = document.getElementById('future_contact');
      if (hp) {
        hp.addEventListener('change', function () {
          if (hp.checked) window._bot_detected = true;
        });
      }
    },
    on_finish: function (data) {
      var hp = document.getElementById('future_contact');
      if (hp && hp.checked) window._bot_detected = true;

      if (window._bot_detected) {
        low_quality = true;
        jsPsych.endExperiment();
      } else if ((data.response !== undefined ? data.response : data.button_pressed) === 1) {
        consent_declined = true;
        jsPsych.endExperiment();
      }
    },
    data: { trial_category: 'consent' }
  };

  var welcome = {
    type: 'instructions',
    pages: [
      '<div style="max-width:760px;margin:0 auto;text-align:center;font-size:20px;line-height:1.65;">' +
        '<div style="font-size:32px;font-weight:800;margin-bottom:18px;">🌠 Welcome to the drone game! 🌌</div>' +
        '<p>You will complete a drone collection game, short memory tests, and a brief questionnaire.</p>' +
        '<p>The study takes about <strong>50 minutes</strong>.</p>' +
        '<p>Your bonus depends on task performance and data quality, so please read carefully and stay attentive.</p>' +
      '</div>'
    ],
    show_clickable_nav: true,
    button_label_previous: "Prev",
    button_label_next: "Next",
    data: {
      task_version: 'v3.1-png-main-practice-emoji-latin-square-block-order',
      stimuli_version: stimuli_version,

      // Canonical condition arrays from stimuli.js
      true_vol: factors_vol,
      true_stc: factors_stc,
      true_valence: factors_valence,

      // Latin-square block-order metadata
      latin_square_group: latin_square_group,
      latin_square_order: block_order.join(','),
      latin_square_order_labels: block_order_labels.join('|'),

      // Backward-compatible alias
      randomized: randomized,

      PROLIFIC_PID: PROLIFIC_PID,
      STUDY_ID: STUDY_ID,
      SESSION_ID: SESSION_ID,
      subId: subId,
      pilot_mode: PILOT_MODE,
      consent_shown: SHOW_CONSENT
    };

  // ── Stimulus sets: main task uses PNGs; practice uses text emojis ──
  var stimulus_set_images = jsPsych.randomization.shuffle(STIMULUS_IMAGE_POOL.slice());
  var practice_stimulus_images = PRACTICE_EMOJI.slice();

  if (DEV_MODE && DEV_NTRIALS > 0) {
    var _devSubsetSize = Math.max(DEV_NTRIALS * 4, 50);
    if (stimulus_set_images.length > _devSubsetSize) {
      stimulus_set_images = stimulus_set_images.slice(0, _devSubsetSize);
      console.log('[DEV] Restricted stimulus_set to ' + _devSubsetSize + ' items');
    }
  }

  // ──────────────────────────────────────────────────────────────
  // Randomized practice-position helpers
  // Used only for practice blocks 1–5.
  // Main-task latent trajectories remain unchanged.
  // ──────────────────────────────────────────────────────────────
  function clampPracticeX(x) {
    return Math.max(12, Math.min(88, x));
  }

  function randBetween(min, max) {
    return min + Math.random() * (max - min);
  }

  function randSign() {
    return Math.random() < 0.5 ? -1 : 1;
  }

  function makePracticeDronePath(numTrials) {
    var path = [];
    var anchor1 = randBetween(32, 68);

    path.push(anchor1);

    if (numTrials >= 2) {
      path.push(clampPracticeX(anchor1 + randBetween(-4, 4)));
    }

    var anchor2 = null;
    if (numTrials >= 3) {
      var move = randSign() * randBetween(10, 16);
      anchor2 = clampPracticeX(anchor1 + move);

      if (Math.abs(anchor2 - anchor1) < 9) {
        anchor2 = clampPracticeX(anchor1 - move);
      }

      path.push(anchor2);
    }

    for (var i = 3; i < numTrials; i++) {
      path.push(clampPracticeX(anchor2 + randBetween(-4, 4)));
    }

    return path;
  }

  function makeRandomPracticeBag(droneX) {
    var wind = randBetween(-6, 6);
    return clampPracticeX(droneX + wind);
  }

  var make_trials = function(practice_no, block_order) {
    var num_trials = 10;
    var is_moving_practice = false;
    var show_missing = false;
    var num_birds = 1;
    var show_bird = true;
    var bird_trial = false;
    var missed_threshold = 3;
    var bag_position = practice_bag_position;
    var bird_position = practice_bird_position;
    var warning_threshold = 16;
    var strong_warning = false;
    var prev_coins_caught = null;

    // ────────────────────────────────────────────────────────────
    // Practice block configuration.
    //
    // Drone visibility (`show_bird`):
    //   practice 1, 2, 3 — drone VISIBLE (drone-visible warmup)
    //   practice 4, 5    — drone HIDDEN (matches main task)
    //
    // Item visibility (`hideStimulus`):
    //   practice 1          — items HIDDEN (items not yet introduced)
    //   practice 2, 3, 4, 5 — items VISIBLE
    //
    // Valence is set per-trial below; practices 3 and 5 use 'loss'.
    // ────────────────────────────────────────────────────────────
    var hideStimulus = false;
    if (practice_no === 1) {
      hideStimulus = true;
    }

    if (practice_no == 1) {
      is_moving_practice = true;
      show_missing = true;
      show_bird = true;
      missed_threshold = 10;
      num_trials = 1;
      block_order = [0];
    } else if (practice_no == 2 || practice_no == 3) {
      show_bird = true;
      num_trials = 3;
      missed_threshold = 2;
      block_order = [0];
    } else if (practice_no == 4) {
      show_bird = false;
      num_trials = 3;
      block_order = [0];
    } else if (practice_no == 5) {
      show_bird = false;
      num_trials = 3;
      block_order = [0];
    } else if (practice_no == 0) {
      num_birds = 4;
      show_bird = false;
      bird_trial = true;
      missed_threshold = 20;
      warning_threshold = 16;
      num_trials = 50;
      bag_position = main_bag_position;
      bird_position = main_bird_position;

      if (DEV_MODE && DEV_NTRIALS > 0) {
        num_trials = Math.min(num_trials, DEV_NTRIALS);
        console.log('[DEV] Capping main block trials to ' + num_trials);
      }
    }

    var stayed_threshold = 4;

    // Block-intro drone images (kept for the "new drone" announcement screen)
    var birds = [
      "static/img/task_assets/reward/drone1.png",
      "static/img/task_assets/reward/drone2.png",
      "static/img/task_assets/reward/drone3.png",
      "static/img/task_assets/reward/drone4.png"
    ];

    var trials = [];
    var missed_responses = 0;
    var total_missed_responses = 0;
    var prev_block = null;
    var k = 0;
    var bucket = 50;
    var stayed = 0;

    // Tracks previous practice drone position so practice drone locations
    // move a meaningful distance from one supply-drop to another.
    var practiceDronePath = null;
    if (practice_no >= 1 && practice_no <= 5) {
      practiceDronePath = makePracticeDronePath(num_trials);
    }

    for (var j = 0; j < num_birds; j++) {
      // ────────────────────────────────────────────────────────────
      // Factor metadata vs. trajectory.
      // `block_order` is the participant's Latin-square order of canonical
      // design indices. Displayed block j+1 plays the trajectory at canonical
      // design index block_order[j]. `block: j+1` remains the displayed block
      // number, while `design_idx` stores the canonical condition identity.
      //
      // Practice valence coverage:
      // Practice 3 and practice 5 are set to 'loss'.
      // ────────────────────────────────────────────────────────────
      var design_idx = (practice_no === 0) ? block_order[j] : 0;
      var practice_valence = (practice_no === 3 || practice_no === 5) ? 'loss' : 'reward';

      if (bird_trial) {
        var planetNum = j + 1;
        var blockValence = factors_valence[design_idx];
        var supplyColor = (blockValence === 'loss') ? 'red' : 'green';

  var feedback1 = {
    type: 'instructions',
    pages: [
      '<div style="max-width:720px;margin:0 auto;text-align:center;font-size:20px;line-height:1.7;">' +
        '<div style="font-size:26px;font-weight:800;margin-bottom:18px;">Mission complete</div>' +
        '<p>Thank you for completing the game and questionnaire.</p>' +
        '<p>One final screen will save your data and finish the study.</p>' +
      '</div>'
    ],
    show_clickable_nav: true,
    button_label_previous: "Prev",
    button_label_next: "Next"
  };

  var _finish_pilot_html =
    '<div style="max-width:720px;margin:0 auto;text-align:center;font-size:20px;line-height:1.7;">' +
      '<div style="font-size:28px;font-weight:800;margin-bottom:18px;">Thank you for participating!</div>' +
      '<p>Please click <strong>Finish</strong> to save your data.</p>' +
      '<p>After the confirmation message appears, you may close this tab.</p>' +
    '</div>';

  var _finish_prolific_html =
    '<div style="max-width:720px;margin:0 auto;text-align:center;font-size:20px;line-height:1.7;">' +
      '<div style="font-size:28px;font-weight:800;margin-bottom:18px;">Thank you for participating!</div>' +
      '<p>Please click <strong>Finish</strong> to save your data and return to Prolific.</p>' +
      '<p style="font-size:16px;color:#555;">Do not close this tab until you are redirected.</p>' +
    '</div>';

  var finish = {
    type: 'instructions',
    pages: [PILOT_MODE ? _finish_pilot_html : _finish_prolific_html],
    show_clickable_nav: true,
    allow_backward: false,
    button_label_next: "Finish"
  };

  var preload_images = [
    'static/img/task_assets/reward/drone0.png',
    'static/img/task_assets/reward/drone1.png',
    'static/img/task_assets/reward/drone2.png',
    'static/img/task_assets/reward/drone3.png',
    'static/img/task_assets/reward/drone4.png'
  ];

  // Preload main object PNG stimuli.
  if (Array.isArray(stimulus_set_images)) {
    preload_images = preload_images.concat(stimulus_set_images);
  }

  // Preload practice stimuli too, if any are image paths.
  // Emoji practice stimuli will be ignored safely.
  if (Array.isArray(practice_stimulus_images)) {
    preload_images = preload_images.concat(
      practice_stimulus_images.filter(function(x) {
        return typeof x === 'string' && (x.indexOf('/') !== -1 || x.indexOf('.png') !== -1);
      })
    );
  }

  var feedback_p1 = {
    type: 'instructions',
    pages: ['<p style="font-size:20px"><br><br>Nice job, keep it up! (1/3 completed)'],
    show_clickable_nav: true,
    button_label_previous: "Prev",
    button_label_next: "Next"
  };

  var feedback_p2 = {
    type: 'instructions',
    pages: ['<p style="font-size:20px"><br><br>Keep paying attention, you are doing great! (2/3 completed)'],
    show_clickable_nav: true,
    button_label_previous: "Prev",
    button_label_next: "Next"
  };

  var attentionCheckFailPage = {
    type: 'instructions',
    pages: ['<br><br>It seems like there were issues with your responses to the attention check question. <br><br>Please make sure to read and answer carefully.'],
    show_clickable_nav: true,
    button_label_next: "Continue"
  };

  var attentionCheck = {
    timeline: [attentionCheckFailPage],
    conditional_function: function() {
      var attentionCheckData = jsPsych.data.getLastTrialData().values()[0]['infrequency'];
      if (attentionCheckData !== 0) {
        failedAttentionChecksCount++;
        return failedAttentionChecksCount <= 3;
      }
      return false;
    }
  };

  var failedAttentionChecksCount = 0;

  (async function() {
    var survey_demographics = {
      type: 'survey-demo',
      button_label: 'Continue'
    };

    function buildBirdMemoryTrials() {
      var num_blocks = block_order.length;
      if (num_blocks === 0) return trials;

      var block_length = Math.floor(trials.length / num_blocks);
      var new_trials = [];

      for (var b = 0; b < num_blocks; b++) {
        var start_idx = b * block_length;
        var end_idx = start_idx + block_length;
        new_trials = new_trials.concat(trials.slice(start_idx, end_idx));
        new_trials = new_trials.concat(create_memory_timeline(b + 1));
      }

      return new_trials;
    }

    var timeline = [];
    function maybeAddCompatGate() {
      if (
        SHOW_COMPAT_GATE &&
        typeof COMPAT_GATE !== 'undefined' &&
        COMPAT_GATE.timeline
      ) {
        timeline = timeline.concat(COMPAT_GATE.timeline);
      } else {
        console.log('[COMPAT] Compatibility gate skipped.');
      }
    }

    // ── Normalise stage aliases ───────────────────────────────────
    var _stageMap = {
      'bird': 'encoding', 'memory': 'test',
      'block1': 'block',  'block2': 'block'
    };
    var _stage = _stageMap[DEV_STAGE] || DEV_STAGE;

    if (DEV_STAGE === 'block1') { DEV_BLOCK_NUM = 1; }
    if (DEV_STAGE === 'block2') { DEV_BLOCK_NUM = 2; }

    // ── DEV: instructions only ────────────────────────────────────
    if (DEV_MODE && _stage === 'instructions') {
      console.log('[DEV] stage: instructions only');
      maybeAddCompatGate();
      timeline = timeline.concat(welcome, feedback0, instructions_loop);
      timeline.push({
        type: 'html-keyboard-response',
        stimulus: '<p style="font-size:22px;padding:40px;"><strong>[DEV]</strong> Instructions complete. Press any key.</p>',
        choices: jsPsych.ALL_KEYS
      });

    // ── DEV: encoding (trial) block only ─────────────────────────
    } else if (DEV_MODE && _stage === 'encoding') {
      console.log('[DEV] stage: encoding, block=' + DEV_BLOCK);
      maybeAddCompatGate();
      timeline.push({
        type: 'html-keyboard-response',
        stimulus: '<p style="font-size:18px;padding:40px;"><strong>[DEV]</strong> Encoding — block <em>' +
                  DEV_BLOCK + '</em>. Press any key.</p>',
        choices: jsPsych.ALL_KEYS
      });
      var _encStart = (DEV_BLOCK_NUM - 1) * 50;
      var _encEnd   = DEV_BLOCK_NUM * 50;
      timeline = timeline.concat(trials.slice(_encStart, _encEnd));
      timeline.push({
        type: 'html-keyboard-response',
        stimulus: '<p style="font-size:22px;padding:40px;"><strong>[DEV]</strong> Encoding complete. Press any key.</p>',
        choices: jsPsych.ALL_KEYS
      });

    // ── DEV: memory / test block only ────────────────────────────
    } else if (DEV_MODE && (_stage === 'test' || _stage === 'recognition')) {
      console.log('[DEV] stage: ' + _stage + ', block=' + DEV_BLOCK);
      maybeAddCompatGate();
      timeline.push({
        type: 'html-keyboard-response',
        stimulus: '<p style="font-size:18px;padding:40px;"><strong>[DEV]</strong> Memory test — block <em>' +
                  DEV_BLOCK + '</em>. Press any key.</p>',
        choices: jsPsych.ALL_KEYS
      });
      timeline.push({
        type: 'call-function',
        func: function () { seedFakeBirdData(DEV_BLOCK_NUM, 50); }
      });
      timeline = timeline.concat(create_memory_timeline(DEV_BLOCK_NUM));
      timeline.push({
        type: 'html-keyboard-response',
        stimulus: '<p style="font-size:22px;padding:40px;"><strong>[DEV]</strong> Memory test complete. Press any key.</p>',
        choices: jsPsych.ALL_KEYS
      });

    // ── DEV: single full block (encoding + memory) ────────────────
    } else if (DEV_MODE && _stage === 'block') {
      console.log('[DEV] stage: full block ' + DEV_BLOCK_NUM);
      maybeAddCompatGate();
      timeline.push({
        type: 'html-keyboard-response',
        stimulus: '<p style="font-size:18px;padding:40px;"><strong>[DEV]</strong> Full block ' +
                  DEV_BLOCK_NUM + '. Press any key.</p>',
        choices: jsPsych.ALL_KEYS
      });
      var _bStart = (DEV_BLOCK_NUM - 1) * 50;
      var _bEnd   = DEV_BLOCK_NUM * 50;
      timeline = timeline.concat(trials.slice(_bStart, _bEnd));
      timeline = timeline.concat(create_memory_timeline(DEV_BLOCK_NUM));
      timeline.push({
        type: 'html-keyboard-response',
        stimulus: '<p style="font-size:22px;padding:40px;"><strong>[DEV]</strong> Block complete. Press any key.</p>',
        choices: jsPsych.ALL_KEYS
      });

    // ── DEV: termination screen ───────────────────────────────────
    } else if (DEV_MODE && _stage === 'termination') {
      console.log('[DEV] stage: termination');
      timeline.push({
        type: 'html-keyboard-response',
        stimulus: '<p style="font-size:24px;padding:40px;"><strong>[DEV] Termination Screen</strong></p>' +
                  '<p style="font-size:16px;color:#d9534f;">Game terminated. Press any key.</p>',
        choices: jsPsych.ALL_KEYS
      });

    // ── Full experiment (DEV full or production) ──────────────────
    } else {
      if (DEV_MODE) {
        console.log('[DEV] stage: full experiment' +
                    (DEV_NTRIALS > 0 ? ' (ntrials=' + DEV_NTRIALS + ')' : '') +
                    ', version=' + DEV_VERSION);
      }
      var combinedTrials = buildBirdMemoryTrials();

      // ── Compatibility gate (before consent, so incompatible participants can return immediately) ───────────────────────
      maybeAddCompatGate();

      if (SHOW_CONSENT) {
        timeline = timeline.concat(consent_trial);
      } else {
        console.log('[CONSENT] consent=0 — consent screen SKIPPED (dev only).');
      }

      timeline = timeline.concat(
        welcome,
        feedback0,
        instructions_loop,
        combinedTrials,
        survey_demographics,
        feedback1,
        finish
      );
    }

    // ── Pavlovia integration ────────────────────────────────────
    var IS_LOCAL_DEV =
      DEV_MODE ||
      window.location.hostname === 'localhost' ||
      window.location.hostname === '127.0.0.1' ||
      window.location.protocol === 'file:';

    var hasPavlovia =
      !IS_LOCAL_DEV &&
      (typeof jsPsych !== 'undefined' &&
      typeof jsPsych.plugins !== 'undefined' &&
      typeof jsPsych.plugins['pavlovia'] !== 'undefined');

    if (hasPavlovia) {
      timeline.unshift({
        type: 'pavlovia',
        command: 'init'
      });
      timeline.push({
        type: 'pavlovia',
        command: 'finish',
        participantId: PROLIFIC_PID || workerId
      });
      console.log('[Pavlovia] init/finish trials added to timeline.');
    } else {
      console.log('[Pavlovia] skipped — local/dev mode or plugin not detected.');
    }

    jsPsych.init({
      timeline: timeline,
      show_progress_bar: true,
      preload_images: preload_images,
      on_finish: function() {
        window.removeEventListener("beforeunload", verify_unload);
        var interaction_data = jsPsych.data.getInteractionData();
        jsPsych.data.get().addToLast({ interactions: interaction_data.json() });

        // Tag every row with participant identifiers.
        jsPsych.data.get().addToAll({
          PROLIFIC_PID:  PROLIFIC_PID,
          STUDY_ID:      STUDY_ID,
          SESSION_ID:    SESSION_ID,
          workerId:      workerId,
          subId:         subId,
          pilot_mode:    PILOT_MODE,
          consent_shown: SHOW_CONSENT,
          device_compatible: !window._device_incompatible,

          latin_square_group: latin_square_group,
          latin_square_order: block_order.join(','),
          latin_square_order_labels: block_order_labels.join('|')
        });

        // 0. Device incompatible: screened out at the compat gate.
        //    Do not reject — Prolific policy requires compensation for
        //    screen-outs. Data is saved so the researcher can identify
        //    and compensate these participants.
        if (window._device_incompatible) {
          console.log('[COMPAT] Participant screened out — device incompatible.');
          return;
        }

        // 1. Declined consent: no save, no Prolific completion.
        if (consent_declined) {
          var declineMsg = PILOT_MODE
            ? '<h2>You have declined to participate</h2>' +
              '<p>Thank you for your interest. No data has been saved.</p>' +
              '<p style="font-size:14px;color:#555;">You may now close this tab.</p>'
            : '<h2>You have declined to participate</h2>' +
              '<p>Thank you for your interest. No data has been saved.</p>' +
              '<p style="font-size:14px;color:#555;">Please return to Prolific and ' +
              'select "Return study" so you are not charged for this session. ' +
              'You may now close this tab.</p>';

          document.body.innerHTML =
            '<div style="max-width:640px;margin:10vh auto;font-family:sans-serif;' +
            'text-align:center;padding:24px;border:1px solid #ddd;border-radius:8px;' +
            'background:#fff;">' +
            declineMsg +
            '</div>';
          return;
        }

        // 2. PILOT mode: show final thank-you; no Prolific redirect.
        if (PILOT_MODE) {
          console.log('[MODE] Pilot mode complete — showing thank-you, no Prolific redirect.');
          document.body.innerHTML =
            '<div style="max-width:640px;margin:10vh auto;font-family:sans-serif;' +
            'text-align:center;padding:24px;border:1px solid #ddd;border-radius:8px;' +
            'background:#fff;">' +
            '<h2>Thank you for participating!</h2>' +
            '<p style="font-size:16px;">Your responses have been recorded.</p>' +
            '<p style="font-size:14px;color:#555;">You may now close this tab.</p>' +
            '</div>';
          return;
        }

        // 3. PRODUCTION mode: existing success / reject redirect logic.
        if (low_quality) {
          redirect_reject(workerId, assignmentId, hitId, CODE_REJECT);
        } else {
          redirect_success(workerId, assignmentId, hitId, CODE_SUCCESS);
        }
      }
    });
  })();
</script>
</html>
