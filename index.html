<!DOCTYPE html>
<html>
<head>
  <title>Drone Game</title>

  <!-- Load libraries -->
  <script src="static/lib/jquery-3.7.1/jquery-3.7.1.min.js"></script>
  <script src="static/lib/jspsych-6.3.1/jspsych.js"></script>
  <script src="static/lib/jspsych-6.3.1/plugins/jspsych-instructions.js?v=instruction-layout-20260923" type="text/javascript"></script>
  <script src="static/lib/jspsych-6.3.1/plugins/jspsych-html-keyboard-response.js" type="text/javascript"></script>

  <script src="static/lib/jspsych-6.3.1/plugins/jspsych-call-function.js" type="text/javascript"></script>
  <script src="static/lib/jspsych-6.3.1/plugins/jspsych-fullscreen.js?v=fullscreen-20260923" type="text/javascript"></script>
  <script src="static/lib/jspsych-6.3.1/plugins/jspsych-html-button-response.js" type="text/javascript"></script>
  <script src="static/lib/jspsych-6.3.1/plugins/jspsych-preload.js" type="text/javascript"></script>
  <link href="static/lib/jspsych-6.3.1/css/jspsych.css" rel="stylesheet" type="text/css"></link>

  <!-- Pavlovia integration plugin (place in static/lib/) -->
  <script src="static/lib/jspsych-pavlovia-3.2.5.js" type="text/javascript"></script>

  <!-- Helper plug-ins -->
  <script src="static/js/jspsych-survey-demo.js" type="text/javascript"></script>
  <script src="static/js/nivturk-plugins.js" type="text/javascript"></script>
  <script src="static/js/jspsych-survey-template.js" type="text/javascript"></script>

  <!-- Auto cache-buster: injects ?v=<deployment-timestamp> into every
       task-script src below. Generated once at page load so every script
       in a single page-view shares the same version string, but every
       new visit forces a fresh fetch. Place this BEFORE the script tags
       it parameterises. -->
  <script>
    window.__APP_VER = (function () {
      var d = new Date();
      var pad = function (n) { return (n < 10 ? '0' : '') + n; };
      return d.getUTCFullYear() +
             pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) +
             pad(d.getUTCHours()) + pad(d.getUTCMinutes()) +
             pad(d.getUTCSeconds());
    })();
    document.write(
      '<script src="static/task/trial.js?v='        + window.__APP_VER + '"><\/script>' +
      '<script src="static/task/memory_task.js?v='  + window.__APP_VER + '"><\/script>'
    );
  </script>

  <link href="static/task/game.min.css" rel="stylesheet" type="text/css"></link>
  <script>
    document.write(
      '<script src="static/task/ui-helpers.js?v='     + window.__APP_VER + '"><\/script>' +
      '<script src="static/task/stimuli.js?v='          + window.__APP_VER + '"><\/script>' +
      '<script src="static/task/stimuli-details.js?v='  + window.__APP_VER + '"><\/script>' +
      '<script src="static/task/comprehension.js?v='   + window.__APP_VER + '"><\/script>' +
      '<script src="static/task/instructions.js?v='     + window.__APP_VER + '"><\/script>' +
      '<script src="static/task/latin_square.js?v='     + window.__APP_VER + '"><\/script>' +
      '<script src="static/task/preload.js?v='          + window.__APP_VER + '"><\/script>' +
      '<script src="static/task/data_saving.js?v='      + window.__APP_VER + '"><\/script>' +
      '<script src="static/task/dev_routes.js?v='       + window.__APP_VER + '"><\/script>' +
      '<script src="static/task/survey.js?v='          + window.__APP_VER + '"><\/script>'
    );
  </script>

  <!-- Required consent gate. Runtime fails closed if this script is unavailable. -->
  <script>
    document.write(
      '<script src="static/task/consent.js?v=' + window.__APP_VER +
      '" onerror="console.error(\'[CONSENT] Required consent.js failed to load\')"><\/script>'
    );
  </script>

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    :root {
      --instruction-title-size: clamp(24px, 2vw, 28px);
      --instruction-body-size: clamp(16px, 1.22vw, 18px);
      --instruction-small-size: clamp(13px, 1vw, 15px);
    }

    @keyframes memory-slow-pop {
      0%, 100% { transform: scale(1); opacity: .88; }
      50% { transform: scale(1.035); opacity: 1; }
    }

    @keyframes memory-no-score-glow {
      0%, 100% { text-shadow: 0 0 5px rgba(59, 130, 246, .13); }
      50% { text-shadow: 0 0 12px rgba(59, 130, 246, .38); }
    }

    .memory-no-score-emphasis,
    .memory-item-note-reminder {
      display: inline-block;
      transform-origin: center;
      will-change: transform, opacity, text-shadow;
    }

    .memory-no-score-emphasis {
      animation:
        memory-slow-pop 2.8s ease-in-out infinite,
        memory-no-score-glow 2.8s ease-in-out infinite;
    }

    .memory-item-note-reminder {
      animation: memory-slow-pop 3.2s ease-in-out infinite;
    }

    /* Shared by the interactive instruction example and both real memory
       sliders. The centered starting marker is intentionally only a faint
       location cue; the first arrow press reveals the response knob. */
    .memory-slider-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-sizing: border-box;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: none;
      opacity: .14;
      transition: left .08s ease, width .15s ease, height .15s ease,
        background .15s ease, border .15s ease, box-shadow .15s ease,
        opacity .15s ease;
    }

    .memory-slider-thumb.is-active {
      width: 22px;
      height: 22px;
      background: rgba(255,255,255,.96);
      border: 2px solid #fff;
      box-shadow: 0 0 18px rgba(255,255,255,.52),
        0 0 8px rgba(255,255,255,.20);
      opacity: 1;
    }

    .memory-item-demo-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 260px));
      justify-content: center;
      column-gap: 42px;
      row-gap: 10px;
      width: min(86vw, 620px);
      margin: 12px auto 4px;
    }

    .memory-item-demo-card:first-child {
      grid-column: 1 / -1;
      width: 260px;
      justify-self: center;
    }

    .memory-item-demo-card .instruction-mock-frame {
      box-sizing: border-box;
      width: 100% !important;
      height: clamp(125px, 18vh, 145px) !important;
      margin: 4px auto !important;
    }

    @media (prefers-reduced-motion: reduce) {
      .memory-no-score-emphasis,
      .memory-item-note-reminder { animation: none; }
    }

    @media (max-width: 760px) {
      .memory-item-demo-grid {
        grid-template-columns: minmax(0, 1fr) !important;
        width: min(88vw, 320px) !important;
      }

      .memory-item-demo-card:first-child {
        grid-column: auto;
        width: auto;
      }
    }

    body { margin: 50px; }
    .jspsych-display-element { transition: opacity 0.12s ease-in-out; }
    .jspsych-display-element.transitioning { opacity: 0; }

    @keyframes instruction-emphasis-pop {
      0%, 100% {
        transform: scale(1);
        text-shadow: 0 0 0 rgba(15, 23, 42, 0);
      }
      50% {
        transform: scale(1.025);
        text-shadow: 0 0 10px rgba(15, 23, 42, 0.18);
      }
    }

    .instruction-emphasis {
      display: inline-block;
      color: #111827 !important;
      font-weight: 800;
      transform-origin: center;
      animation: instruction-emphasis-pop 2.6s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .instruction-emphasis { animation: none; }
    }
    
    /* Default jsPsych nav buttons: subtle, for instruction Prev/Next */
    .jspsych-btn {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 13px;
      border-radius: 9px;
      border: 1px solid rgba(148, 163, 184, 0.55);
      background: rgba(255, 255, 255, 0.55);
      color: rgba(51, 65, 85, 0.72);
      cursor: pointer;
      box-shadow: none;
      opacity: 0.72;
    }

    .jspsych-btn:hover {
      background: rgba(255, 255, 255, 0.85);
      color: rgba(30, 41, 59, 0.95);
      opacity: 1;
    }

    /* Instruction pages use a scrollable content row and a reserved nav row.
       The buttons therefore stay aligned without covering text or examples. */
    body:has(.jspsych-instructions-layout),
    body:has(.jspsych-moving-practice-layout) {
      overflow: hidden !important;
    }

    .jspsych-content-wrapper {
      min-height: 0;
    }

    .jspsych-content.jspsych-instructions-layout,
    .jspsych-content.jspsych-moving-practice-layout {
      box-sizing: border-box;
      align-self: stretch;
      width: 100%;
      max-width: 100%;
      height: calc(100% - 20px);
      min-height: 0;
      margin: 10px auto;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;
    }

    .jspsych-instructions-page {
      box-sizing: border-box;
      width: 100%;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable both-edges;
      padding: clamp(12px, 2.2vh, 26px) clamp(12px, 2vw, 44px)
               clamp(16px, 2.5vh, 30px);
      text-align: center;
    }

    .instruction-copy {
      box-sizing: border-box;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      color: #111827;
      text-align: center;
      font-size: var(--instruction-body-size);
      line-height: 1.42;
    }

    .instruction-headline {
      max-width: 100%;
      margin: 0 auto 14px;
      font-size: var(--instruction-title-size) !important;
      font-weight: 800;
      line-height: 1.25;
      text-align: center;
      text-wrap: balance;
    }

    /* Reference-derived key sentences replace invented summary headings on
       instruction pages while retaining the same consistent visual hierarchy. */
    .instruction-key-line {
      font-size: var(--instruction-title-size) !important;
      font-weight: 800;
      line-height: 1.25;
      color: #0f172a;
      text-align: center;
      text-wrap: balance;
    }

    .instruction-strategy-line {
      font-size: var(--instruction-title-size);
      font-weight: 500;
      line-height: 1.28;
      color: #0f172a;
      text-align: center;
      text-wrap: balance;
    }

    .instruction-strategy-line strong {
      font-weight: 850;
    }

    .instruction-strategy-line em {
      font-style: italic;
    }

    .instruction-copy-body {
      text-align: center;
    }

    /* One semantic sentence per row. Long sentences can be divided into
       clause-sized segments: segments stay close together, while complete
       sentences receive a larger vertical gap. */
    .instruction-lines {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      text-align: center;
    }

    .instruction-sentence {
      display: block;
      margin: 0 auto;
    }

    .instruction-sentence + .instruction-sentence {
      margin-top: 0.7em;
    }

    .instruction-segment {
      display: block;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
      text-align: center;
      text-wrap: balance;
    }

    .instruction-segment + .instruction-segment {
      margin-top: 0.16em;
    }

    @media (min-width: 1000px) {
      .instruction-copy-body > .instruction-lines .instruction-segment {
        white-space: nowrap;
      }
    }

    .instruction-intro-card {
      box-sizing: border-box;
      width: min(620px, 100%);
      margin: clamp(12px, 4vh, 36px) auto;
      padding: clamp(18px, 3vw, 24px) clamp(18px, 4vw, 30px);
      font-size: var(--instruction-body-size);
      line-height: 1.42;
      text-align: center;
    }

    .instruction-intro-list {
      display: block;
      max-width: 100%;
      margin: 0 auto;
      padding: 0;
      font-size: var(--instruction-body-size);
      text-align: center;
    }

    .instruction-intro-main {
      margin: 0 auto 14px;
    }

    .instruction-intro-list li {
      text-align: center;
      text-wrap: balance;
    }

    .instruction-start-hint {
      margin-top: 18px;
      color: #475569;
      font-size: var(--instruction-small-size);
      text-align: center;
    }

    /* Sequence diagrams size each miniature scene to its grid cell instead
       of allowing viewport-based demo widths to collide with adjacent cards. */
    .instruction-sequence-item .instruction-mock-frame {
      box-sizing: border-box;
      width: 100% !important;
      height: clamp(112px, 19vh, 185px) !important;
      margin: 8px auto !important;
    }

    @media (max-width: 700px) {
      .instruction-movement-comparison {
        grid-template-columns: minmax(0, 1fr) !important;
        width: 100% !important;
      }

      .instruction-sequence-or {
        justify-content: center;
        padding-top: 0 !important;
      }

      .instruction-sequence-item .instruction-mock-frame {
        height: clamp(104px, 16vh, 145px) !important;
      }
    }

    .jspsych-instructions-nav {
      position: relative;
      left: auto;
      bottom: auto;
      transform: none;
      z-index: 20;
      box-sizing: border-box;
      width: 304px;
      min-height: 62px;
      margin: 10px auto 0 !important;
      padding: 10px 14px !important;
      display: grid;
      grid-template-columns: 132px 132px;
      gap: 12px;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(148, 163, 184, 0.38);
      border-radius: 16px;
      background: rgba(248, 250, 252, 0.92);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.16);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    .jspsych-instructions-nav .jspsych-btn {
      box-sizing: border-box;
      width: 132px;
      min-width: 132px;
      height: 42px;
      min-height: 42px;
      margin: 0 !important;
      padding: 0 14px;
      border: 1px solid rgba(71, 85, 105, 0.46);
      border-radius: 10px;
      background: #ffffff;
      color: #1e293b;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.10);
      font-size: 14px;
      font-weight: 750;
      line-height: 1;
      opacity: 1;
      transition: background .16s ease, border-color .16s ease,
                  box-shadow .16s ease, transform .16s ease;
      pointer-events: auto;
    }

    .jspsych-instructions-nav #jspsych-instructions-back {
      grid-column: 1;
    }

    .jspsych-instructions-nav #jspsych-instructions-next {
      grid-column: 2;
    }

    .jspsych-instructions-nav .jspsych-btn:hover {
      transform: translateY(-1px);
      background: #f8fafc;
      border-color: rgba(30, 64, 175, 0.62);
      color: #0f172a;
      box-shadow: 0 5px 14px rgba(30, 64, 175, 0.16);
    }

    .jspsych-instructions-nav .jspsych-btn:focus-visible {
      outline: 3px solid rgba(59, 130, 246, 0.34);
      outline-offset: 2px;
    }

    .jspsych-instructions-nav .jspsych-btn:disabled {
      visibility: visible;
      opacity: 0.46;
      color: #64748b;
      background: #eef2f7;
      border-color: rgba(148, 163, 184, 0.5);
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .jspsych-instructions-nav .jspsych-btn:disabled:hover {
      color: #64748b;
      background: #eef2f7;
      border-color: rgba(148, 163, 184, 0.5);
      box-shadow: none;
      transform: none;
    }

    /* The rail warm-up uses the same footer and reserves a separate row for
       its feedback message, so neither element sits on top of the game. */
    .jspsych-content.jspsych-moving-practice-layout {
      grid-template-rows: minmax(0, 1fr) 42px auto;
      padding: 0 clamp(8px, 2vw, 24px);
    }

    .jspsych-moving-practice-layout .game-container {
      grid-row: 1;
      box-sizing: border-box;
      align-self: center;
      justify-self: center;
      left: auto;
      top: auto;
      width: min(80vw, 1400px);
      height: 100%;
      max-height: 80vh;
      min-height: 0;
      transform: none;
    }

    .jspsych-moving-practice-layout .main-container {
      width: 100%;
      height: 85.625%;
    }

    .practice-tip {
      grid-row: 2;
      align-self: center;
      justify-self: center;
      box-sizing: border-box;
      max-width: min(560px, calc(100vw - 32px));
      min-height: 34px;
      margin: 4px auto;
      padding: 6px 14px;
      border: 1px solid #fde68a;
      border-radius: 10px;
      background: #fffbeb;
      color: #854d0e;
      box-shadow: 0 4px 12px rgba(133, 77, 14, 0.12);
      font-size: 14px;
      font-weight: 650;
      line-height: 1.35;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .practice-instructions-nav {
      grid-row: 3;
    }

    @media (max-width: 420px) {
      .jspsych-content.jspsych-instructions-layout,
      .jspsych-content.jspsych-moving-practice-layout {
        height: calc(100% - 12px);
        margin: 6px auto;
      }

      .jspsych-instructions-page {
        padding: 10px 10px 14px;
        scrollbar-gutter: auto;
      }

      .jspsych-instructions-nav {
        width: calc(100vw - 20px);
        min-height: 56px;
        margin-top: 6px !important;
        padding: 7px 10px !important;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 10px;
      }
      .jspsych-instructions-nav .jspsych-btn {
        width: 100%;
        min-width: 0;
        height: 40px;
        min-height: 40px;
      }

      .instruction-start-hint {
        font-size: 14px;
      }

      .practice-tip {
        font-size: 13px;
        padding: 5px 10px;
      }
    }

    /* Fullscreen button only: prominent */
    .fullscreen-card .jspsych-btn,
    #jspsych-fullscreen-btn {
      font-size: 17px;
      font-weight: 800;
      padding: 12px 24px;
      border-radius: 13px;
      border: 1px solid #94a3b8;
      background: #1e40af;
      color: white;
      opacity: 1;
      box-shadow: 0 6px 18px rgba(30, 64, 175, .22);
    }

    .fullscreen-card .jspsych-btn:hover,
    #jspsych-fullscreen-btn:hover {
      background: #1d4ed8;
    }

    /* Persistent fullscreen reminder — small corner badge, non-intrusive */
    #fs-remind {
      position: fixed;
      top: 48px;
      right: 8px;
      z-index: 99999;
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(30,30,30,.88);
      color: #e2e8f0;
      font: 700 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
      user-select: none;
      display: none;
      box-shadow: 0 4px 14px rgba(0,0,0,.28);
      max-width: min(230px, calc(100vw - 20px));
      text-align: center;
    }
    #fs-remind:hover {
      background: rgba(30,30,30,.98);
    }

    #fs-remind:focus-visible {
      outline: 3px solid rgba(96,165,250,.72);
      outline-offset: 3px;
    }

    /* When the reminder is visible, reserve its vertical area on text-heavy
       instruction pages so it never covers a heading or sentence. */
    body.fullscreen-warning-visible .jspsych-instructions-page {
      padding-top: max(clamp(12px, 2.2vh, 26px), 54px);
    }
  </style>
</head>
<body>
<button id="fs-remind" type="button" aria-live="polite" aria-hidden="true">⛶ Return to full screen</button>
</body>
<script>
  // ──────────────────────────────────────────────────────────────
  // URL parameters (parsed early so mobile / dev checks can use them)
  // Prolific: ?PROLIFIC_PID=...&STUDY_ID=...&SESSION_ID=...
  // Debug fallbacks: workerId / subId
  // ──────────────────────────────────────────────────────────────
  var _urlParams = new URLSearchParams(window.location.search);

  function _getParam(name, fallback) {
    var v = _urlParams.get(name);
    return (v !== null && v !== '') ? v : fallback;
  }

  var DEV_MODE    = _urlParams.get('dev') === '1';
  var DEV_STAGE   = _urlParams.get('stage') || 'full';
  var DEV_NTRIALS = parseInt(_urlParams.get('ntrials'), 10) || 0;

  // DEV_BLOCK accepts either an integer ('1'–'4') or a named condition
  // string ('noBoundary', 'boundary'). Keep it as a string so named
  // variants aren't silently coerced to 1 by parseInt.
  var DEV_BLOCK   = _urlParams.get('block') || '1';
  // Numeric alias for code that needs an integer block index.
  var _blockAliases = { 'noBoundary': 1, 'boundary': 2 };
  var DEV_BLOCK_NUM = _blockAliases[DEV_BLOCK] || (parseInt(DEV_BLOCK, 10) || 1);

  // ?version=simple | version=rich — task variant switch.
  var DEV_VERSION = _urlParams.get('version') || 'full';

  // ──────────────────────────────────────────────────────────────
  // Pilot mode flag.
  //   pilot=1  (or missing)  → pilot/testing mode: save data, show
  //                            a thank-you screen, NO Prolific redirect.
  //   pilot=0                → production mode:    save data, then
  //                            redirect to Prolific via the existing
  //                            success / reject logic.
  // Default is pilot mode (opt-in to production) for safety.
  // ──────────────────────────────────────────────────────────────
  var PILOT_MODE = _urlParams.get('pilot') !== '0';
  console.log('[MODE] PILOT_MODE = ' + PILOT_MODE +
              '  (set ?pilot=0 in the URL for production / Prolific redirects)');

  // ──────────────────────────────────────────────────────────────
  // Consent toggle.
  //   consent=1 (or missing) → show the consent screen (default).
  //   consent=0              → skip the consent screen in DEV_MODE only.
  //   Pilot and production runs always require consent, even if a URL
  //   incorrectly includes consent=0.
  // ──────────────────────────────────────────────────────────────
  var SHOW_CONSENT = !DEV_MODE || _urlParams.get('consent') !== '0';
  console.log('[MODE] SHOW_CONSENT = ' + SHOW_CONSENT +
              '  (?dev=1&consent=0 skips consent during testing only)');

  // ──────────────────────────────────────────────────────────────
  // Mobile rejection — mirrors Flask __init__.py error 1001.
  // Original blocked: android, iphone, ipad, wii. We add a few more
  // obvious mobile tokens. Skipped in DEV_MODE so you can still test.
  // ──────────────────────────────────────────────────────────────
  (function _mobileCheck() {
    if (DEV_MODE) return;
    var ua = (navigator.userAgent || '').toLowerCase();
    var MOBILE_TOKENS = [
      'android', 'iphone', 'ipad', 'ipod', 'blackberry',
      'windows phone', 'iemobile', 'opera mini', 'wii', 'mobile'
    ];
    var isMobile = MOBILE_TOKENS.some(function (t) { return ua.indexOf(t) !== -1; });
    if (isMobile) {
      document.body.innerHTML =
        '<div style="max-width:640px;margin:10vh auto;font-family:sans-serif;' +
        'text-align:center;padding:24px;border:1px solid #ddd;border-radius:8px;' +

    type: 'instructions',
    pages: [
      cheerfulCompletionScreen(
        'Thank You for Your Participation',
          (PILOT_MODE
            ? '<p><strong>Press “Thumbs up!” to finish and save your responses for bonus payment.</strong></p>' +
              '<p style="color:#4b5563;">After the confirmation message appears, you may close this tab.</p>'
            : '<p><strong>Press “Thumbs up!” to finish and save your responses for bonus payment.</strong></p>' +
              '<p style="font-size:16px;color:#4b5563;">Keep this tab open while your responses are saved and you return to Prolific.</p>'
          ),
        { accent: '14,165,233', accent2: '168,85,247' }
      )
    ],
    show_clickable_nav: true,
    allow_backward: false,
    button_label_next: "Thumbs up!",
    button_label_next_arrow: false
  };

  // Preload image list (built by static/task/preload.js)
  var preload_images = buildPreloadImageList(stimulus_set_images, practice_stimulus_images);

  (async function() {
    var survey_demographics = (typeof buildSurveyTrial === 'function')
      ? buildSurveyTrial()
      : { type: 'survey-demo', button_label: 'Continue' };

    function buildBlockMemoryTrials() {
      var num_blocks = block_order.length;
      if (num_blocks === 0) return trials;

      var block_length = Math.floor(trials.length / num_blocks);
      var new_trials = [];

      for (var b = 0; b < num_blocks; b++) {
        var start_idx = b * block_length;
        var end_idx = start_idx + block_length;
        new_trials = new_trials.concat(trials.slice(start_idx, end_idx));
        new_trials = new_trials.concat(create_memory_timeline(b + 1));
      }

      return new_trials;
    }

    var timeline = [];

    // ── Stage normalisation and dev-route aliases ──
    //
    // 'gate' → 'instructions': the compatibility gate was removed from
    // runtime, so old ?stage=gate links now land on the instructions
    // route instead of a removed-feature placeholder. If a compatibility
    // gate is reintroduced in the future, delete this one alias entry —
    // dev_routes.js still has a literal stage==='gate' branch ready to
    // receive it (see the comment there).
    //
    // 'encoding-test' is the canonical name for the combined
    // encoding+memory-test route (previously called "Full block";
    // internal stage value is still 'block', unchanged, so old
    // ?stage=block / ?stage=block1 / ?stage=block2 links keep working).
    // Several alternate spellings are mapped too because a literal '+'
    // typed directly in a URL query string is decoded to a SPACE by
    // URLSearchParams (form-encoding rules) — it does NOT survive as
    // a '+' character — so '?stage=encoding+test' actually arrives
    // here as the string "encoding test". Use 'encoding-test' (hyphen)
    // when sharing links; it round-trips through any URL bar untouched.
    var _stageMap = {
      'bird': 'encoding', 'memory': 'test',
      'block1': 'block',  'block2': 'block',
      'encoding-test':  'block',
      'survey':          'survey',
      'demographics':    'survey',   // ← canonical, recommended
      'encoding_test':  'block',
      'encoding test':  'block',   // unencoded '+' decodes to this
      'encoding+test':  'block',   // properly percent-encoded (%2B) decodes to this
      'gate': 'instructions'
    };
    var _stage = _stageMap[DEV_STAGE] || DEV_STAGE;

    if (DEV_STAGE === 'block1') { DEV_BLOCK_NUM = 1; }
    if (DEV_STAGE === 'block2') { DEV_BLOCK_NUM = 2; }

    // ── Build task timeline ──
    var _skipPreload = false;

    if (DEV_MODE && _stage !== 'full') {
      // Dev route: delegate to dev_routes.js
      var _devResult = buildDevTimeline({
        stage:                  _stage,
        devBlockNum:            DEV_BLOCK_NUM,
        devBlock:               DEV_BLOCK,
        devNtrials:             DEV_NTRIALS,
        devVersion:             DEV_VERSION,
        trials:                 trials,
        create_memory_timeline: create_memory_timeline,
        welcome:                welcome,
        feedback0:              feedback0,
        instructions_loop:      instructions_loop,
        comprehensionTimeline:  comprehensionOnlyTimeline,
        consent_trial:          consent_trial,
        enter_fullscreen:       enter_fullscreen,
        buildBlockMemoryTrials:  buildBlockMemoryTrials,
        survey_demographics:    survey_demographics,
        feedback1:              feedback1,
        finish:                 finish,
        SHOW_CONSENT:           SHOW_CONSENT
      });
      timeline = _devResult.timeline;
      _skipPreload = _devResult.skipPreload;
    } else {
      // Full experiment (production or dev ?stage=full)
      if (DEV_MODE) {
        console.log('[DEV] stage: full experiment' +
                    (DEV_NTRIALS > 0 ? ' (ntrials=' + DEV_NTRIALS + ')' : '') +
                    ', version=' + DEV_VERSION);
      }
      var combinedTrials = buildBlockMemoryTrials();

      // Preload-completion gate: skips instantly if background
      // preload is already done, otherwise shows the cosmic
      // "Preparing the game…" screen with progress until the
      // queue drains. Without this, the first few main-task trials
      // can race the still-in-flight preload and show empty boxes.
      var _gateTrial = (typeof buildPreloadGateTrial === 'function')
        ? buildPreloadGateTrial() : null;

      timeline = timeline.concat(
        consent_trial,
        enter_fullscreen,
        welcome,
        feedback0,
        instructions_loop
      );
      if (_gateTrial) timeline.push(_gateTrial);
      timeline = timeline.concat(
        combinedTrials,
        feedback1,
        survey_demographics,
        finish,
        { type: 'fullscreen', fullscreen_mode: false }
      );
    }

    // ── Environment detection and data-saving setup ──
    // (logic in static/task/data_saving.js)
    var _env = initEnvironment(_urlParams, DEV_MODE, PILOT_MODE);

    // ── Prefix trials: Pavlovia-init → metadata stamp → preload ──
    var _prefixTrials = [];

    if (_env.USE_PAVLOVIA) {
      _prefixTrials.push({ type: 'pavlovia', command: 'init' });
    }

    _prefixTrials.push(buildMetadataStampTrial(_env,
      { PROLIFIC_PID: PROLIFIC_PID, STUDY_ID: STUDY_ID,
        SESSION_ID: SESSION_ID, workerId: workerId, subId: subId },
      { pilotMode: PILOT_MODE, devMode: DEV_MODE, showConsent: SHOW_CONSENT,
        latinSquareGroup: latin_square_group,
        blockOrder: block_order, blockOrderLabels: block_order_labels }
    ));

    // Performance benchmark — measures timer resolution and DOM speed.
    // Flags machines where timing precision may compromise data quality.
    _prefixTrials.push({
      type: 'call-function',
      func: function() {
        var N = 200;
        var t0 = performance.now();
        for (var i = 0; i < N; i++) { performance.now(); }
        var timerMs = (performance.now() - t0) / N;

        var d0 = performance.now();
        for (var j = 0; j < 50; j++) {
          var el = document.createElement('div');
          document.body.appendChild(el);
          document.body.removeChild(el);
        }
        var domMs = (performance.now() - d0) / 50;

        var slow = (timerMs > 0.5 || domMs > 2.0);
        jsPsych.data.addProperties({
          perf_timer_ms_per_call: Math.round(timerMs * 1000) / 1000,
          perf_dom_ms_per_op: Math.round(domMs * 1000) / 1000,
          perf_slow_flag: slow,
          stimulus_block_orders: window._stimulus_block_orders
            ? window._stimulus_block_orders.join('|||') : null
        });
        if (slow) console.warn('[PERF] Slow machine detected: timer=' + timerMs.toFixed(3) + 'ms, dom=' + domMs.toFixed(3) + 'ms');
      }
    });

    // ── Preload strategy ──
    // Three cases:
    //   1. Dev text-only stages (instructions/comprehension):
    //      skip preload entirely. _skipPreload is true.
    //   2. Dev image stages (encoding/test/block): images needed
    //      immediately, no instructions to hide behind, so use the
    //      FOREGROUND preload with a visible progress bar.
    //   3. Full experiment: kick off BACKGROUND preload AFTER the
    //      metadata stamp, so the loading happens while the
    //      participant goes through instructions, comprehension,
    //      and practice. trial.js / memory_task.js call
    //      ensurePreloaded() just-in-time as a safety net.
    var _isFullExperiment = !DEV_MODE || _stage === 'full';

    if (_skipPreload) {
      // No preload needed.
    } else if (_isFullExperiment) {
      var _bgPreload = buildBackgroundPreloadTrial(preload_images);
      if (_bgPreload) _prefixTrials.push(_bgPreload);
    } else {
      var _fgPreload = buildPreloadTrial(false, preload_images);
      if (_fgPreload) _prefixTrials.push(_fgPreload);
    }

    timeline = _prefixTrials.concat(timeline);

    // Record total supply_caught (for bonus calculation) as final metadata.
    timeline.push({
      type: 'call-function',
      func: function() {
        var mainTrials = jsPsych.data.get().filter({ trial_type: 'trial' }).values();
        var totalCaught = 0;
        var totalScore = 0;
        var mainCount = 0;
        for (var t = 0; t < mainTrials.length; t++) {
          if (mainTrials[t].practice_no && mainTrials[t].practice_no !== 0) continue;
          if (typeof mainTrials[t].supply_caught === 'number') {
            totalCaught += mainTrials[t].supply_caught;
            totalScore += (mainTrials[t].score || 0);
            mainCount++;
          }
        }
        jsPsych.data.addProperties({
          total_supply_caught: totalCaught,
          total_score: totalScore,
          total_scored_trials: mainCount
        });
        console.log('[DATA] Total supply caught: ' + totalCaught + '/' + (mainCount * 10) +
                    ', total score: ' + totalScore);
      }
    });

    // ── Suffix: Pavlovia finish (must be last) ──
    if (_env.USE_PAVLOVIA) {
      timeline.push({
        type: 'pavlovia',
        command: 'finish',
        participantId: PROLIFIC_PID || workerId
      });
    }

    // ── Launch ──
    jsPsych.init({
      timeline: timeline,
      show_progress_bar: true,
      on_finish: buildOnFinishCallback(_env, {
        PROLIFIC_PID:      PROLIFIC_PID,
        workerId:          workerId,
        assignmentId:      assignmentId,
        hitId:             hitId,
        PILOT_MODE:        PILOT_MODE,
        DEV_MODE:          DEV_MODE,
        CODE_SUCCESS:      CODE_SUCCESS,
        CODE_REJECT:       CODE_REJECT,
        getConsentDeclined: function() { return consent_declined; },
        getLowQuality:      function() { return low_quality; },
        verifyUnload:       verify_unload
      })
    });
  })();
</script>
</html>
